[workspace]
members = ["services/settingsd"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/xyzhenrik/HydrogenOS"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
zbus = { version = "5.11.0", features = ["tokio"] }

